name: studyreels
description: Fully local study app — lecture videos split into topic/problem reels by a tiny on-device LLM.
publish_to: "none"
version: 0.2.1+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0 # Cactus Dart FFI binding (bindings/flutter/cactus.dart)
  path_provider: ^2.1.0 # app files dir for the on-device model bundle
  video_player: ^2.9.1 # real playback of the ORIGINAL file at reel timestamps
  image_picker: ^1.1.2 # gallery video pick via the system picker (no broad storage permission)
  provider: ^6.1.2 # LibraryStore state for feed + library screens
  archive: ^3.6.1 # unzip the downloaded model bundles (streaming, low memory)
  crypto: ^3.0.3 # sha-256 integrity check of the downloaded bundles

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/prompts/
    - assets/samples/
    - assets/eval/
